name: Release

on: workflow_dispatch

jobs:
    release:
        permissions:
            contents: read
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  registry-url: 'https://registry.npmjs.org'

            - uses: pnpm/action-setup@v3
              name: Install pnpm
              id: pnpm-install
              with:
                  version: '9'
                  run_install: false

            - name: Get pnpm store directory
              id: pnpm-cache
              shell: bash
              run: |
                  echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

            - uses: actions/cache@v4
              name: Setup pnpm cache
              with:
                  path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
                  key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
                  restore-keys: |
                      ${{ runner.os }}-pnpm-store-

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Lint
              run: pnpm lint

            - name: Build
              run: pnpm run build

            - name: Pack
              run: npm run pack

            - name: Run @arethetypeswrong/cli
              run: pnpm exec attw package.tgz

            - name: Publish
              shell: bash
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_ACCESS_TOKEN }}
              run: |
                  if [ -z "$NODE_AUTH_TOKEN" ]; then
                      echo "::error::Configure the NPM_ACCESS_TOKEN repository secret before publishing."
                      exit 1
                  fi

                  package_name="$(jq -r .name dist/package.json)"
                  version="$(jq -r .version dist/package.json)"

                  echo "Publishing $package_name@$version"
                  npm publish package.tgz --access public

                  echo "npm: \`+ $package_name@$version\`" >> "$GITHUB_STEP_SUMMARY"
